services:
  openwa:
    build:
      context: .
      dockerfile: openwa.Dockerfile
    volumes:
      - openwa_sessions:/app/.wwebjs_auth
      - openwa_data:/app/data
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=sqlite:./data/openwa.db
    restart: unless-stopped

volumes:
  openwa_sessions:
  openwa_data:
