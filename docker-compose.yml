services:
  # ── OpenWA WhatsApp Gateway ────────────────────────────────────────────────
  openwa:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - openwa_sessions:/app/.wwebjs_auth
      - openwa_data:/app/data
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=sqlite:./data/openwa.db
    command: >
      sh -c "
        if [ ! -f /app/package.json ]; then
          apk add --no-cache git &&
          git clone https://github.com/rmyndharis/OpenWA.git /app
        fi &&
        cd /app &&
        npm install --omit=dev &&
        npm run start:prod
      "
    restart: unless-stopped

volumes:
  openwa_sessions:
  openwa_data:
