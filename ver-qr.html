<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ver QR WhatsApp</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; padding: 30px; gap: 20px; }
  h2 { margin: 0; color: #25D366; }
  input, button { padding: 10px 16px; border-radius: 8px; font-size: 14px; }
  input { background: #222; border: 1px solid #444; color: #eee; width: 420px; }
  button { background: #25D366; color: #000; font-weight: bold; border: none; cursor: pointer; }
  #qr-img { width: 260px; height: 260px; background: white; padding: 10px; border-radius: 12px; display: none; }
  #error { color: #f87171; font-size: 13px; display: none; }
  .row { display: flex; gap: 8px; align-items: center; }
  label { font-size: 12px; color: #aaa; min-width: 90px; }
</style>
</head>
<body>
<h2>📱 Escanear QR WhatsApp</h2>

<div class="row">
  <label>Session ID</label>
  <input id="session" value="97df04f3-9c5f-4e5d-adf1-dcf739ddca5b" />
</div>
<div class="row">
  <label>API Key</label>
  <input id="apikey" value="owa_k1_95f3c6183e585b2ae6ac4ae2171ed24e4a49a684e84fd122dc1c9a5b0c9bdcc1" />
</div>

<button onclick="cargarQR()">Cargar QR</button>

<p id="error"></p>
<img id="qr-img" alt="QR Code" />
<p id="instrucciones" style="display:none;color:#aaa;font-size:13px;text-align:center;">
  Abre WhatsApp en tu celular → <strong style="color:#eee">⋮ → Dispositivos vinculados → Vincular dispositivo</strong><br>
  Escanea este código QR
</p>

<script>
async function cargarQR() {
  const session = document.getElementById('session').value.trim();
  const apikey  = document.getElementById('apikey').value.trim();
  const img     = document.getElementById('qr-img');
  const err     = document.getElementById('error');
  const inst    = document.getElementById('instrucciones');

  img.style.display = 'none';
  err.style.display = 'none';
  inst.style.display = 'none';

  try {
    const res = await fetch(`http://localhost:3000/api/sessions/${session}/qr`, {
      headers: { 'x-api-key': apikey }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const qr = data.qrCode || data.qr;
    if (!qr) throw new Error('No hay QR disponible');
    img.src = qr.startsWith('data:') ? qr : `data:image/png;base64,${qr}`;
    img.style.display = 'block';
    inst.style.display = 'block';
  } catch(e) {
    err.textContent = 'Error: ' + e.message + '. Verifica que Docker está corriendo.';
    err.style.display = 'block';
  }
}
</script>
</body>
</html>
