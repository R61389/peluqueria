<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" fill="none">
  <!-- Pompadour: dramatic height sweep at front, smooth back -->
  <defs>
    <linearGradient id="pompGrad" x1="200" y1="30" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d2410"/>
      <stop offset="1" stop-color="#1e0e05"/>
    </linearGradient>
  </defs>
  <!-- Back/sides base -->
  <ellipse cx="200" cy="165" rx="125" ry="115" fill="#1e0e05"/>
  <!-- Sides fade -->
  <path d="M75 190 Q68 160 72 135 Q80 108 100 95 L108 103 Q90 118 88 144 Q86 168 92 192 Z" fill="#180b04"/>
  <path d="M325 190 Q332 160 328 135 Q320 108 300 95 L292 103 Q310 118 312 144 Q314 168 308 192 Z" fill="#180b04"/>
  <!-- The pompadour sweep - big front wave -->
  <path d="M115 130 Q130 70 200 35 Q240 20 270 42 Q295 60 300 95 Q285 70 260 60 Q232 50 210 52 Q185 54 168 68 Q148 85 140 108 Q130 90 115 130 Z" fill="url(#pompGrad)"/>
  <!-- Pompadour roll shape -->
  <path d="M115 128 Q140 95 175 78 Q200 68 228 72 Q258 78 278 98 Q290 115 292 140 Q275 118 248 108 Q222 98 200 98 Q178 98 158 108 Q136 120 130 140 Q120 130 115 128 Z" fill="#3d2410"/>
  <!-- Strand lines showing the sweep backward -->
  <g opacity="0.6" stroke="#7a4a28" stroke-width="2">
    <path d="M148 128 C162 108 185 90 210 82" /><path d="M165 122 C178 104 200 87 224 80"/>
    <path d="M180 118 C192 101 214 85 238 80" /><path d="M195 115 C206 99 226 84 248 81"/>
    <path d="M208 115 C218 100 236 87 256 86" /><path d="M220 118 C229 104 244 93 261 93"/>
    <path d="M132 135 C147 116 168 100 188 93" />
  </g>
  <!-- Gloss highlight on the roll -->
  <ellipse cx="200" cy="90" rx="55" ry="16" fill="white" opacity="0.1" transform="rotate(-5 200 90)"/>
</svg>
