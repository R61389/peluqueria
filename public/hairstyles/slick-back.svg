<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <!-- Slick Back: all hair combed backward, very smooth and shiny -->
  <defs>
    <linearGradient id="slickG" x1="150" y1="80" x2="280" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a1a0a"/>
      <stop offset="0.5" stop-color="#1e1008"/>
      <stop offset="1" stop-color="#0f0804"/>
    </linearGradient>
  </defs>
  <!-- Main hair mass swept back -->
  <path d="M88 155 Q82 125 90 100 Q105 65 140 50 Q170 38 200 36 Q230 38 260 50 Q295 65 310 100 Q318 125 312 155 Q298 128 275 115 Q248 104 220 100 Q208 98 200 98 Q192 98 180 100 Q152 104 125 115 Q102 128 88 155 Z" fill="url(#slickG)"/>
  <!-- Smooth slick-back strands flowing backward -->
  <g opacity="0.45" stroke="#4a2e12" stroke-width="2">
    <path d="M125 112 C145 95 168 84 192 80" /><path d="M138 106 C158 90 180 80 204 76"/>
    <path d="M152 102 C170 87 192 77 216 74" /><path d="M167 100 C183 86 204 76 228 73"/>
    <path d="M182 99 C196 86 216 77 238 75"  /><path d="M197 99 C209 87 228 79 248 78"/>
    <path d="M211 100 C222 89 239 82 257 82" /><path d="M224 104 C234 94 249 88 264 88"/>
  </g>
  <!-- Sides close-cut -->
  <path d="M82 158 Q76 130 82 105 Q70 128 72 155 Z" fill="#140a03" opacity="0.7"/>
  <path d="M318 158 Q324 130 318 105 Q330 128 328 155 Z" fill="#140a03" opacity="0.7"/>
  <!-- High-gloss highlight - characteristic of slicked hair -->
  <ellipse cx="200" cy="100" rx="80" ry="16" fill="white" opacity="0.14" transform="rotate(-3 200 100)"/>
  <ellipse cx="210" cy="108" rx="50" ry="9" fill="white" opacity="0.08"/>
</svg>
